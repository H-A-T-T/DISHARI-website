<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <!-- Multiple Shades of Green -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#006A4E" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <linearGradient id="mintGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>

    <!-- Multiple Shades of Red -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D5E" />
      <stop offset="55%" stop-color="#F42A41" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Soft Shadow for Depth on White Background -->
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#064E3B" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="600" height="240" fill="#FFFFFF" />

  <!-- LOGO MARK: Compass + Chat Bubble + Checkmark/Path -->
  <g transform="translate(45, 30)" filter="url(#softShadow)">
    
    <!-- Outer Light Mint Accent Ring -->
    <circle cx="90" cy="90" r="82" fill="none" stroke="url(#mintGrad)" stroke-width="3" opacity="0.45" />

    <!-- Main Chat Bubble / Compass Base (Deep & Emerald Green Shades) -->
    <path d="M 90 16 
             C 49.1 16, 16 49.1, 16 90 
             C 16 108.5, 22.8 125.4, 34 138.4 
             L 22 164 
             L 51.5 154.2 
             C 63.1 160.5, 76.2 164, 90 164 
             C 130.9 164, 164 130.9, 164 90 
             C 164 49.1, 130.9 16, 90 16 Z" fill="url(#emeraldGrad)" />

    <!-- Inner Secondary Green Layer (Creates multi-shade depth) -->
    <path d="M 90 28 
             C 124.2 28, 152 55.8, 152 90 
             C 152 118, 133.5 141.6, 108 149.3 
             C 126 135, 136 114, 136 90 
             C 136 58, 115 34, 90 28 Z" fill="url(#mintGrad)" opacity="0.35" />

    <!-- Stylized Document Lines (White + Light Mint) -->
    <rect x="52" y="65" width="38" height="6" rx="3" fill="#A7F3D0" opacity="0.9" />
    <rect x="52" y="80" width="28" height="6" rx="3" fill="#A7F3D0" opacity="0.7" />
    <rect x="52" y="95" width="20" height="6" rx="3" fill="#A7F3D0" opacity="0.5" />

    <!-- Guiding Compass Needle / Verification Checkmark (Shades of Red) -->
    <!-- Left Wing of Check/Needle (Coral/Light Red) -->
    <path d="M 55 112 L 82 136 L 86 116 L 67 100 Z" fill="url(#coralGrad)" />
    
    <!-- Main Upward Guiding Pointer (Crimson to Dark Red Gradient) -->
    <path d="M 82 136 L 148 38 L 104 118 Z" fill="url(#crimsonGrad)" />
    <path d="M 82 136 L 148 38 L 86 116 Z" fill="#FF6B7A" opacity="0.85" />

    <!-- Rising Sun / AI Guiding Star at the Tip (Bright Crimson & Coral) -->
    <circle cx="148" cy="38" r="8" fill="url(#crimsonGrad)" stroke="#FFFFFF" stroke-width="2.5" />
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g transform="translate(245, 0)">
    <!-- Website Name: দিশারী (Dishari) -->
    <text x="0" y="122" font-family="&#39;Hind Siliguri&#39;, &#39;Noto Sans Bengali&#39;, &#39;Li Ador Noirrit&#39;, sans-serif" font-size="76" font-weight="700" fill="#064E3B" letter-spacing="1">দিশারী</text>

    <!-- Red & Green Accent Dot over/near text -->
    <circle cx="242" cy="72" r="8" fill="url(#crimsonGrad)" />
    <circle cx="258" cy="72" r="5" fill="#10B981" />

    <!-- Multi-shade Divider Bar -->
    <rect x="4" y="140" width="85" height="5" rx="2.5" fill="url(#emeraldGrad)" />
    <rect x="97" y="140" width="45" height="5" rx="2.5" fill="url(#mintGrad)" />
    <rect x="150" y="140" width="35" height="5" rx="2.5" fill="url(#crimsonGrad)" />

    <!-- Subtitle / Tagline -->
    <text x="4" y="172" font-family="&#39;Hind Siliguri&#39;, &#39;Noto Sans Bengali&#39;, sans-serif" font-size="20" font-weight="600" fill="#059669">ডিজিটাল নাগরিক সহায়ক</text>
  </g>
</svg>