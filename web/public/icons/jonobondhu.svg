<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <!-- Metallic Silver & Gray Gradients for Robot Head -->
    <linearGradient id="silverBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5" />
      <stop offset="45%" stop-color="#a3a3a3" />
      <stop offset="100%" stop-color="#404040" />
    </linearGradient>

    <linearGradient id="chromeRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#525252" />
      <stop offset="50%" stop-color="#d4d4d4" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Glowing White & Silver LED Eyes -->
    <radialGradient id="whiteLedEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e5e5e5" />
      <stop offset="80%" stop-color="#737373" />
      <stop offset="100%" stop-color="#262626" />
    </radialGradient>

    <!-- Monochrome Light Metallic Accents -->
    <linearGradient id="lightGrayAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#737373" />
    </linearGradient>

    <!-- White Eye Glow Filter -->
    <filter id="eyeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- LED Grid Pattern for Eyes -->
    <pattern id="ledGrid" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Main Robot Icon Group (Flat, Crisp, No Drop Shadow) -->
  <g>

    <!-- Left & Right Dual-Ring Ear Cups -->
    <!-- Left Ear -->
    <rect x="40" y="138" width="12" height="36" rx="6" fill="url(#chromeRim)" stroke="#171717" stroke-width="2.5" />
    <rect x="50" y="128" width="16" height="54" rx="8" fill="url(#silverBody)" stroke="#171717" stroke-width="3" />
    <!-- Right Ear -->
    <rect x="228" y="138" width="12" height="36" rx="6" fill="url(#chromeRim)" stroke="#171717" stroke-width="2.5" />
    <rect x="214" y="128" width="16" height="54" rx="8" fill="url(#silverBody)" stroke="#171717" stroke-width="3" />

    <!-- Left & Right Side Antennae -->
    <!-- Left Antenna -->
    <line x1="58" y1="130" x2="68" y2="78" stroke="#171717" stroke-width="9" stroke-linecap="round" />
    <line x1="58" y1="130" x2="68" y2="78" stroke="url(#chromeRim)" stroke-width="5" stroke-linecap="round" />
    <circle cx="68" cy="74" r="9" fill="url(#silverBody)" stroke="#171717" stroke-width="3" />
    <circle cx="66" cy="72" r="3" fill="#ffffff" />

    <!-- Right Antenna -->
    <line x1="222" y1="130" x2="212" y2="78" stroke="#171717" stroke-width="9" stroke-linecap="round" />
    <line x1="222" y1="130" x2="212" y2="78" stroke="url(#chromeRim)" stroke-width="5" stroke-linecap="round" />
    <circle cx="212" cy="74" r="9" fill="url(#silverBody)" stroke="#171717" stroke-width="3" />
    <circle cx="210" cy="72" r="3" fill="#ffffff" />

    <!-- Robot Main Head Silhouette -->
    <path d="M 140 58
             C 192 58, 218 88, 218 136
             L 218 176
             C 218 206, 194 222, 140 222
             C 86 222, 62 206, 62 176
             L 62 136
             C 62 88, 88 58, 140 58 Z" fill="url(#silverBody)" stroke="#171717" stroke-width="4" />

    <!-- Subtle Metallic Corner Highlights -->
    <path d="M 65 130 C 65 102, 78 82, 95 72 C 82 90, 78 112, 74 134 Z" fill="url(#lightGrayAccent)" opacity="0.55" />
    <path d="M 215 130 C 215 102, 202 82, 185 72 C 198 90, 202 112, 206 134 Z" fill="url(#lightGrayAccent)" opacity="0.55" />
    <path d="M 66 176 C 68 198, 84 212, 106 216 C 98 202, 86 192, 66 176 Z" fill="url(#lightGrayAccent)" opacity="0.55" />
    <path d="M 214 176 C 212 198, 196 212, 174 216 C 182 202, 194 192, 214 176 Z" fill="url(#lightGrayAccent)" opacity="0.45" />

    <!-- Top Forehead Metallic Gloss Highlight -->
    <path d="M 92 78 C 115 66, 165 66, 188 78 C 165 72, 115 72, 92 78 Z" fill="#ffffff" opacity="0.65" />

    <!-- Scalloped / Wavy Brow Accent Line -->
    <path d="M 76 106
             Q 98 114, 118 105
             Q 140 96, 162 105
             Q 182 114, 204 106" fill="none" stroke="url(#chromeRim)" stroke-width="5" stroke-linecap="round" />
    <path d="M 76 108
             Q 98 116, 118 107
             Q 140 98, 162 107
             Q 182 116, 204 108" fill="none" stroke="#171717" stroke-width="2.5" stroke-linecap="round" />

    <!-- LEFT EYE: Metallic Bezel + Glowing White Matrix LED -->
    <g transform="translate(105, 148)">
      <!-- Outer Dark Bezel -->
      <circle cx="0" cy="0" r="28" fill="#171717" stroke="#0a0a0a" stroke-width="3.5" />
      <!-- Metallic Inner Ring -->
      <circle cx="0" cy="0" r="24" fill="none" stroke="#a3a3a3" stroke-width="2.5" />
      <!-- Glowing White Core -->
      <circle cx="0" cy="0" r="21" fill="url(#whiteLedEye)" filter="url(#eyeGlow)" />
      <!-- LED Pixel Texture -->
      <circle cx="0" cy="0" r="21" fill="url(#ledGrid)" />
      <!-- Specular Glint -->
      <circle cx="-6" cy="-6" r="4" fill="#ffffff" opacity="0.95" />
    </g>

    <!-- RIGHT EYE: Metallic Bezel + Glowing White Matrix LED -->
    <g transform="translate(175, 148)">
      <!-- Outer Dark Bezel -->
      <circle cx="0" cy="0" r="28" fill="#171717" stroke="#0a0a0a" stroke-width="3.5" />
      <!-- Metallic Inner Ring -->
      <circle cx="0" cy="0" r="24" fill="none" stroke="#a3a3a3" stroke-width="2.5" />
      <!-- Glowing White Core -->
      <circle cx="0" cy="0" r="21" fill="url(#whiteLedEye)" filter="url(#eyeGlow)" />
      <!-- LED Pixel Texture -->
      <circle cx="0" cy="0" r="21" fill="url(#ledGrid)" />
      <!-- Specular Glint -->
      <circle cx="-6" cy="-6" r="4" fill="#ffffff" opacity="0.95" />
    </g>

    <!-- Friendly Curved Smile -->
    <path d="M 116 190 Q 140 205 164 190" fill="none" stroke="#171717" stroke-width="8" stroke-linecap="round" />
    <path d="M 116 190 Q 140 205 164 190" fill="none" stroke="url(#chromeRim)" stroke-width="4" stroke-linecap="round" />
    <!-- Smile Corner Dimples -->
    <path d="M 112 186 Q 115 191 119 194" fill="none" stroke="#171717" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 168 186 Q 165 191 161 194" fill="none" stroke="#171717" stroke-width="3.5" stroke-linecap="round" />

  </g>
</svg>