<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%" fill="none">
  <defs>
    <!-- Multiple Shades of Green -->
    <linearGradient id="emeraldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="mintGradDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <!-- Multiple Shades of Red -->
    <linearGradient id="crimsonGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B7A" />
      <stop offset="55%" stop-color="#F42A41" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>

    <linearGradient id="coralGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Soft Emerald Glow for Dark Background -->
    <filter id="softGlowDark" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#10B981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- LOGO MARK: Compass + Chat Bubble + Guiding Needle -->
  <g transform="translate(45, 30)" filter="url(#softGlowDark)">
    <!-- Outer Mint Ring -->
    <circle cx="90" cy="90" r="82" fill="none" stroke="url(#mintGradDark)" stroke-width="3.5" opacity="0.75" />

    <!-- Main Chat Bubble / Compass Base -->
    <path d="M 90 16 
             C 49.1 16, 16 49.1, 16 90 
             C 16 108.5, 22.8 125.4, 34 138.4 
             L 22 164 
             L 51.5 154.2 
             C 63.1 160.5, 76.2 164, 90 164 
             C 130.9 164, 164 130.9, 164 90 
             C 164 49.1, 130.9 16, 90 16 Z" fill="url(#emeraldGradDark)" />

    <!-- Inner Secondary Green Layer -->
    <path d="M 90 28 
             C 124.2 28, 152 55.8, 152 90 
             C 152 118, 133.5 141.6, 108 149.3 
             C 126 135, 136 114, 136 90 
             C 136 58, 115 34, 90 28 Z" fill="url(#mintGradDark)" opacity="0.45" />

    <!-- Stylized Document Lines -->
    <rect x="52" y="65" width="38" height="6" rx="3" fill="#ECFDF5" opacity="0.95" />
    <rect x="52" y="80" width="28" height="6" rx="3" fill="#ECFDF5" opacity="0.8" />
    <rect x="52" y="95" width="20" height="6" rx="3" fill="#ECFDF5" opacity="0.6" />

    <!-- Guiding Compass Needle / Verification Checkmark -->
    <path d="M 55 112 L 82 136 L 86 116 L 67 100 Z" fill="url(#coralGradDark)" />
    
    <!-- Main Upward Guiding Pointer -->
    <path d="M 82 136 L 148 38 L 104 118 Z" fill="url(#crimsonGradDark)" />
    <path d="M 82 136 L 148 38 L 86 116 Z" fill="#FFA1AC" opacity="0.9" />

    <!-- Rising Sun / AI Guiding Star at the Tip -->
    <circle cx="148" cy="38" r="8.5" fill="url(#crimsonGradDark)" stroke="#FFFFFF" stroke-width="2.5" />
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g transform="translate(245, 0)">
    <!-- Website Name: দিশারী in Crisp White for Dark Backgrounds -->
    <text x="0" y="122" font-family="'Kalpurush', 'Noto Sans Bengali', system-ui, sans-serif" font-size="80" font-weight="800" fill="#FFFFFF" letter-spacing="1">দিশারী</text>

    <!-- Red & Green Accent Dot -->
    <circle cx="250" cy="68" r="8.5" fill="url(#crimsonGradDark)" />
    <circle cx="268" cy="68" r="5.5" fill="#34D399" />

    <!-- Multi-shade Divider Bar -->
    <rect x="4" y="142" width="85" height="5.5" rx="2.75" fill="url(#emeraldGradDark)" />
    <rect x="97" y="142" width="45" height="5.5" rx="2.75" fill="url(#mintGradDark)" />
    <rect x="150" y="142" width="35" height="5.5" rx="2.75" fill="url(#crimsonGradDark)" />

    <!-- Subtitle / Tagline in Radiant Mint -->
    <text x="4" y="174" font-family="'Kalpurush', 'Noto Sans Bengali', system-ui, sans-serif" font-size="22" font-weight="600" fill="#34D399" letter-spacing="0.5">ডিজিটাল নাগরিক সহায়ক</text>
  </g>
</svg>
